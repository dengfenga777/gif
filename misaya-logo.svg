<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="Misaya logo">
  <defs>
    <linearGradient id="mark" x1="12" y1="16" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="word" x1="122" y1="24" x2="382" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.48 0 0 0 0 1 0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <rect x="16" y="20" width="80" height="80" rx="18" fill="url(#mark)"/>
    <path d="M33 68L47 54L60 64L79 42" fill="none" stroke="#020617" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33 68L47 54L60 64L79 42" fill="none" stroke="#e0f2fe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="36" r="5" fill="#e0f2fe"/>
  </g>

  <text x="122" y="80"
        fill="url(#word)"
        font-family="Inter, SF Pro Display, Segoe UI, Arial, sans-serif"
        font-size="58"
        font-weight="760"
        letter-spacing="0">Misaya</text>
</svg>
